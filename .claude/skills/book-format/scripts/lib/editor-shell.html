<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AET — book editor</title>
<!-- No data-pagedjs-ignore here, and it matters more than it looks. Marking
     the theme ignored keeps Paged.js from stripping it, but it also keeps
     Paged.js from ever reading it — and @page lives there. Ignored, the book
     laid out on Paged.js's default page box of 8.5in rather than the 7in
     trim: right type, right styling, wrong measure, so every line break,
     column fill and page break on screen was one the book will not make.
     It also meant no running heads, no folio and no proof notice, because a
     margin box is generated from the @page rule Paged.js never saw.
     The editor chrome below stays ignored. That one must not be processed. -->
<style id="ed-theme">/*THEME_CSS*/</style>
<style data-pagedjs-ignore>
  :root{
    --nav:#0D2035; --teal:#137C7A; --tint:#EAF3F3; --gold:#B79A5B;
    --ui:#F4F6F7; --line:#D9DFE2; --quiet:#66717C;
    --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  }
  /* The chrome is sized by its declared width, not width+padding+border:
     without this the panel measured 343px against a 318px gutter and the
     page slid under it by exactly the difference. */
  #ed-bar,#ed-side,#ed-panel,#ed-busy{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#8C949A}
  #ed-bar,#ed-side,#ed-panel,#ed-busy,#ed-hint{font-family:var(--sans);-webkit-font-smoothing:antialiased}

  #ed-bar{position:fixed;top:0;left:0;right:0;height:46px;z-index:9000;background:var(--nav);
    color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;font-size:13px}
  #ed-bar b{font-weight:700}
  #ed-bar select{font-family:var(--sans);font-size:13px;padding:4px 6px;border-radius:3px;
    border:1px solid #2A4157;background:#132A42;color:#fff;max-width:340px}
  #ed-bar .sp{flex:1}
  #ed-bar button{font-family:var(--sans);font-size:12.5px;padding:5px 11px;border-radius:3px;
    border:1px solid #2A4157;background:#17304A;color:#fff;cursor:pointer}
  #ed-bar button:hover{background:#1F3E5C}
  #ed-bar button.go{background:var(--teal);border-color:var(--teal)}
  #ed-bar .count{color:#9FB3C4;font-size:12px}

  #ed-side{position:fixed;top:46px;left:0;bottom:0;width:208px;z-index:8000;background:#fff;
    border-right:1px solid var(--line);overflow:auto;font-size:12.5px}
  #ed-side h4{margin:0;padding:10px 12px 6px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--teal)}
  #ed-side a{display:block;border-left:3px solid transparent;padding:7px 12px;cursor:pointer;
    color:#17202A;text-decoration:none}
  #ed-side a:hover{background:var(--ui)}
  #ed-side a.on{border-left-color:var(--teal);background:var(--tint);font-weight:600}
  #ed-side .pg{color:var(--quiet);font-size:11px;float:right;font-variant-numeric:tabular-nums}

  /* Both rails are fixed, so the stage has to reserve room for BOTH or the
     page centres itself underneath the correction panel. The right gutter is
     reserved whether the panel is open or not: making it conditional moved
     the page sideways every time you selected something. */
  /* Paged.js lays its pages out as two-up spreads: .pagedjs_pages is a flex
     row twice the page width, and the first page carries a left margin of a
     whole page so it sits on the right of the spread. That is why the page
     appeared under the correction panel however the stage was centred — the
     stage was 914px and its contents 1632px. One centred column instead. */
  #ed-stage{margin:46px 322px 0 212px;padding:22px 0 90px;zoom:var(--zoom,1)}
  #ed-stage .pagedjs_pages{display:block!important;width:auto!important;max-width:none!important}
  #ed-stage .pagedjs_page{margin:0 auto 6px!important;float:none!important}
  body.railoff #ed-stage{margin-left:0}
  body.railoff #ed-side{display:none}
  #ed-stage .pagedjs_page{box-shadow:0 2px 14px rgba(0,0,0,.3);background:#fff}
  .ed-lbl{display:block;width:max-content;margin:22px auto 6px;font-size:11px;color:#23313C;
    background:#E7EBEE;padding:2px 9px;border-radius:2px}

  .ed-hover{outline:2px dashed var(--teal)!important;outline-offset:2px;cursor:pointer}
  .ed-sel{outline:2.5px solid var(--gold)!important;outline-offset:2px;background:rgba(183,154,91,.12)!important}
  .ed-done{position:relative}
  .ed-done::before{content:"";position:absolute;left:-9px;top:0;bottom:0;width:3px;
    background:var(--teal);pointer-events:none}

  #ed-panel{position:fixed;right:0;top:46px;bottom:0;width:314px;z-index:8500;background:#fff;
    border-left:1px solid var(--line);padding:14px;overflow:auto;display:none}
  #ed-panel.on{display:block}
  #ed-panel h5{margin:0 0 4px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--teal)}
  #ed-panel .what{font-family:Georgia,serif;font-size:13.5px;color:#17202A;background:var(--ui);
    padding:9px 10px;border-radius:3px;max-height:150px;overflow:auto;margin-bottom:5px}
  #ed-panel .meta{font-size:11.5px;color:var(--quiet);margin-bottom:12px}
  #ed-panel button.act{display:block;width:100%;text-align:left;margin-bottom:6px;padding:8px 10px;
    border:1px solid var(--line);border-radius:3px;background:#fff;cursor:pointer;
    font-family:var(--sans);font-size:12.5px;color:#17202A}
  #ed-panel button.act:hover{border-color:var(--teal);background:var(--tint)}
  #ed-panel button.act small{display:block;color:var(--quiet);font-size:11px;margin-top:2px}
  #ed-panel .undo{border-color:#C0545A;color:#9B2C32}
  #ed-panel hr{border:0;border-top:1px solid var(--line);margin:14px 0}
  #ed-panel .step{border:1px solid var(--line);border-radius:5px;padding:9px 10px;margin-bottom:6px}
  #ed-panel .step .lab{font-size:12.5px;color:#17202A;margin-bottom:7px}
  #ed-panel .step .lab i{font-style:normal;font-weight:700;color:var(--teal);
    font-variant-numeric:tabular-nums}
  #ed-panel .step button{font-family:var(--sans);font-size:14px;line-height:1;width:38px;
    padding:6px 0;margin-right:5px;border-radius:3px;border:1px solid var(--line);
    background:#fff;color:#17202A;cursor:pointer}
  #ed-panel .step button:hover{border-color:var(--teal);background:var(--tint)}
  #ed-panel .step button.z{width:auto;padding:6px 9px;font-size:11.5px}
  #ed-panel .step button.go{width:auto;padding:6px 10px;font-size:11.5px;
    background:var(--teal);border-color:var(--teal);color:#fff;margin-right:0;float:right}
  #ed-panel .step small{display:block;clear:both;color:var(--quiet);font-size:11px;padding-top:8px}

  #ed-busy{position:fixed;inset:46px 322px 0 212px;z-index:9500;background:rgba(246,247,248,.92);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:#17202A}
  #ed-busy.off{display:none}
  #ed-hint{position:fixed;left:222px;bottom:14px;z-index:9000;background:var(--nav);color:#fff;
    font-size:12px;padding:7px 12px;border-radius:3px;opacity:.93}
</style>
</head>
<body>

<div id="ed-bar">
  <b>AET</b>
  <select id="ed-sections" aria-label="Section"></select>
  <button id="ed-prev" title="Previous section">&larr;</button>
  <button id="ed-next" title="Next section">&rarr;</button>
  <span class="count" id="ed-count"></span>
  <span class="sp"></span>
  <span class="count" id="ed-changes"></span>
  <label class="count" for="ed-zoom">zoom</label>
  <select id="ed-zoom" aria-label="Zoom">
    <option value="0.6">60%</option>
    <option value="0.75">75%</option>
    <option value="0.9">90%</option>
    <option value="1" selected>100%</option>
    <option value="1.25">125%</option>
  </select>
  <button id="ed-rail" title="Hide the section list">&#9776;</button>
  <button id="ed-save" class="go">Download edited book</button>
  <button id="ed-undo">Undo last</button>
  <button id="ed-list">Save changes file</button>
  <button id="ed-load">Load changes file</button>
  <button id="ed-reset">Clear all</button>
</div>

<div id="ed-side"><h4>Sections</h4><div id="ed-sectionlist"></div></div>
<div id="ed-stage"></div>
<div id="ed-busy">paginating this section…</div>
<div id="ed-hint">Click anything on a page to change it</div>

<div id="ed-panel">
  <h5>Selected</h5>
  <div class="what" id="ed-what"></div>
  <div class="meta" id="ed-meta"></div>
  <button class="act" data-do="page">Start a new page before this<small>pushes this and what follows to the next page</small></button>
  <button class="act" data-do="column">Start a new column before this<small>pushes it to the top of the next column</small></button>
  <button class="act" data-do="keepnext">Keep with what follows<small>stops a break between this and the next block</small></button>
  <button class="act" data-do="keepprev">Keep with what precedes<small>stops a break between this and the block above</small></button>
  <button class="act" data-do="image">Insert an image before this<small>choose a file from your computer</small></button>
  <button class="act" data-do="text">Edit this text<small>type on the page, then click away</small></button>
  <button class="act" data-do="joinprev">Join to the block above<small>for a paragraph the build split in two</small></button>
  <button class="act" data-do="joinnext">Join with the block below<small>the same repair, from the upper half</small></button>
  <button class="act" data-do="allowbreak">Let this block break<small>fills the column instead of moving whole to the next one</small></button>
  <button class="act" data-do="span">Run across both columns<small>one wide column for this block; click again to put it back in two</small></button>
  <div class="step" id="ed-track">
    <div class="lab">Tracking <i id="ed-trackval">0</i></div>
    <button data-tk="-5" title="Tighten">&minus;</button>
    <button data-tk="5" title="Open up">+</button>
    <button data-tk="0" class="z">normal</button>
    <button class="go" id="ed-trackgo">Apply</button>
    <small>Squeezes or opens the letter-spacing of this block, to pull a word
      up a line or push one down. Step until the line count drops. Tightening
      is unnoticeable to about &minus;25; past that it begins to show.</small>
  </div>
  <hr>
  <button class="act undo" data-do="delete">Delete this block<small>removes it from the book</small></button>
  <button class="act undo" data-do="undo">Undo changes to this block</button>
  <button class="act" data-do="close">Close</button>
</div>

<template id="ed-book"><!--BOOK_BODY--></template>
<template data-ref="pagedjs-content" id="ed-slot"></template>

<script>
// ---------------------------------------------------------------------------
// Prepared before Paged.js loads.
//
// Paged.js's auto mode looks for <template data-ref="pagedjs-content"> as a
// direct child of body and paginates whatever is in it. Using its own path
// rather than driving Previewer by hand is deliberate: four attempts at the
// manual API each laid out a single page of whitespace, because flow() wants
// the exact fragment wrapContent() produces and an element, a string and a
// hand-built fragment are all near-misses that fail silently.
//
// So the section to work on is chosen here and dropped into that template,
// and changing section reloads the page. Edits are kept as a short list of
// marks in localStorage and replayed onto the pristine book on each load —
// which is why a 3MB book never has to be stored anywhere.
// ---------------------------------------------------------------------------
window.ED = (function(){
"use strict";
var PAGEMAP = /*PAGE_MAP*/;
var KEY = 'aet-editor-marks';
var SECKEY = 'aet-editor-section';
var STAMPKEY = 'aet-editor-saved';
var PLACEKEY = 'aet-editor-place';

var SRC = document.createElement('div');
SRC.innerHTML = document.getElementById('ed-book').innerHTML;

// A correction is stored against a block's number, and the number is the
// block's position in the book. So anything that adds or removes elements
// moves every number after it, and a saved correction lands on a different
// paragraph without a word of warning.
//
// Placing the figures did exactly that: each "Artwork to come" slot was four
// elements — the slot and its label, filename and description — and the
// drawing that replaced it is one <svg> with dozens inside. So a drawing
// takes the slot's number, its insides take none, and three numbers are
// skipped after it. Every block then keeps the number it had before the
// figures existed, and a click anywhere on a drawing selects the drawing.
//
// The same goes for anything added to the book once correcting has begun — a
// line on the copyright page, say. An added element is marked data-new in the
// book and numbered in a series of its own, so it takes no number from the
// blocks after it and can still be selected and corrected itself.
var n = 1, added = 1;
SRC.querySelectorAll('*').forEach(function(el){
  var art = el.closest ? el.closest('svg.figure-art, svg.part-emblem') : null;
  if (art && art !== el) return;
  // A wrapper put round blocks that were already there: the wrapper is new,
  // what it holds is not, and what it holds keeps its numbers.
  if (el.hasAttribute('data-wrap')){ el.setAttribute('data-ed', 'n' + (added++)); return; }
  var fresh = el.closest ? el.closest('[data-new]') : null;
  if (fresh){ el.setAttribute('data-ed', 'n' + (added++)); return; }
  el.setAttribute('data-ed', n++);
  if (art === el && el.classList.contains('figure-art')) n += 3;
});

function loadMarks(){
  try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ return []; }
}
function saveMarks(m){
  try {
    localStorage.setItem(KEY, JSON.stringify(m));
    localStorage.setItem(STAMPKEY, new Date().toISOString());
  }
  catch(e){ alert('Could not save that change: the browser refused local storage.'); }
}
var marks = loadMarks();

// Every edit repaginates, and repaginating means reloading, which lands you
// at the top of a section that may be fifty pages long. So before the reload
// note where the work was: the block itself, and the page it sat on in case
// the edit was the kind that removes the block.
function savePlace(id){
  try {
    var el = id == null ? null : document.querySelector('.pagedjs_page [data-ed="' + id + '"]');
    var pg = el && el.closest ? el.closest('.pagedjs_page') : null;
    localStorage.setItem(PLACEKEY, JSON.stringify({
      id: id == null ? null : String(id),
      page: pg ? pg.getAttribute('data-page-number') : null,
      y: window.scrollY || 0
    }));
  } catch (e) {}
}

marks.forEach(function(m){
  var el = SRC.querySelector('[data-ed="' + m.id + '"]');
  if (!el) return;
  if (m.do === 'page'){ el.classList.add('push-page'); el.style.breakBefore = 'page'; }
  else if (m.do === 'column'){ el.style.breakBefore = 'column'; }
  else if (m.do === 'keepnext' || m.do === 'keepprev'){
    var other = m.do === 'keepnext' ? el.nextElementSibling : el.previousElementSibling;
    if (!other) return;
    var w = document.createElement('div');
    w.style.breakInside = 'avoid';
    w.setAttribute('data-ed', 'w' + m.id);
    el.parentNode.insertBefore(w, m.do === 'keepnext' ? el : other);
    if (m.do === 'keepnext'){ w.appendChild(el); w.appendChild(other); }
    else { w.appendChild(other); w.appendChild(el); }
  }
  else if (m.do === 'image'){
    var fig = document.createElement('div');
    fig.className = 'figure'; fig.setAttribute('data-ed', 'i' + m.id);
    var im = document.createElement('img'); im.src = m.src; im.alt = m.name || '';
    fig.appendChild(im);
    el.parentNode.insertBefore(fig, el);
  }
  else if (m.do === 'text'){ el.innerHTML = m.html; }
  else if (m.do === 'track'){
    // Copyfitting, in the unit type has always used for it: thousandths of an
    // em, so the nudge stays proportional to the type size rather than fixed
    // in points. A whole point per step would be about twenty times too
    // coarse — one click would space the words visibly apart.
    el.style.letterSpacing = (Number(m.em) / 1000) + 'em';
  }
  else if (m.do === 'allowbreak'){ el.style.breakInside = 'auto'; }
  else if (m.do === 'span'){
    // Out of the two-column flow and across the full measure. The paragraph
    // rule keeps the last line ragged; at this width a justified last line
    // would be spaced out across the whole page.
    el.style.columnSpan = 'all';
    el.style.textAlignLast = 'auto';
  }
  else if (m.do === 'delete'){ el.remove(); }
  else if (m.do === 'joinprev'){
    // What you would otherwise do by hand to a paragraph the build split:
    // put its words back on the end of the block above and drop the remains.
    //
    // The block above is often not a paragraph. The build binds a label to the
    // opening of its entry by wrapping both in one unbreakable box, so the
    // visible first half of a split paragraph is the last paragraph *inside*
    // that box, not the box. Joining to the box put the text after the
    // paragraph instead of onto the end of it, which is why it looked as
    // though nothing combined.
    var up = el.previousElementSibling;
    if (!up) return;
    var TEXT = 'p,li,h1,h2,h3,h4,h5,dd';
    if (!up.matches(TEXT)){
      var inner = up.querySelectorAll(TEXT);
      if (!inner.length) return;
      var host = inner[inner.length - 1];
      host.innerHTML = host.innerHTML.replace(/\s+$/, '') + ' ' + el.innerHTML;
      // It was half a paragraph, with its last line justified to hide the
      // cut. It is the whole paragraph now, and that same rule would stretch
      // the paragraph's real last line across the measure.
      if (host.classList.contains('lead-head')) host.classList.add('lead-whole');
      // That box was told not to break because it held a label and one line.
      // It now holds a whole paragraph, and a box that cannot break and no
      // longer fits a column stops pagination dead rather than overflowing.
      var box = host.closest('.keep-label,.keep-lead,.entry-lead') || up;
      if (box) box.style.breakInside = 'auto';
    } else {
      up.innerHTML = up.innerHTML.replace(/\s+$/, '') + ' ' + el.innerHTML;
    }
    el.remove();
  }
});

function innerHolder(comp){
  var a = comp.firstElementChild, b = a && a.firstElementChild;
  return (b && b.children.length) ? b : (a || comp);
}
var chunks = [];
Array.prototype.forEach.call(SRC.children, function(comp){
  var hold = innerHolder(comp);
  var units = Array.prototype.slice.call(hold.children);
  if (!units.length) return;
  var cur = null;
  units.forEach(function(u){
    var opener = u.classList && u.classList.contains('keep-lead') &&
                 u.classList.contains('section-opener');
    if (!cur || opener){ cur = { comp: comp, units: [], title: '' }; chunks.push(cur); }
    cur.units.push(u);
    if (!cur.title){
      // The heading, not the unit's text: every section box carries a hidden
      // run-head copy of its own title, so textContent reads it twice —
      // "II. Tissue Repair, Skin, and Anti-AgingII. Tissue Re".
      var h = u.querySelector && u.querySelector('h1,h2,h3,h4,h5');
      var t = ((h || u).textContent || '').replace(/\s+/g,' ').trim();
      if (t) cur.title = t.slice(0,52);
    }
  });
});

// The map is keyed on the first sixty characters, so a short heading like
// "I. Foundations" collides with its own line in the table of contents and
// labels the section page 13. Only text long enough to be unique is used.
function pageOfNode(node){
  var t = (node.textContent||'').replace(/\s+/g,' ').trim();
  if (t.length >= 45){
    var hit = PAGEMAP.blocks[t.slice(0,60)];
    if (hit) return hit;
  }
  // The map indexes text blocks, not the wrappers around them, so a click on
  // an entry or a panel finds nothing. Ask its first real block instead.
  var kids = node.querySelectorAll ? node.querySelectorAll('p,li,h1,h2,h3,h4,h5,td,th') : [];
  for (var i = 0; i < kids.length; i += 1){
    var k = (kids[i].textContent||'').replace(/\s+/g,' ').trim();
    if (k.length < 45) continue;
    var h = PAGEMAP.blocks[k.slice(0,60)];
    if (h) return h;
  }
  return undefined;
}
// The map holds sheets. The book prints roman through the front matter and
// counts from 1 after it, so every number shown to a person goes through here
// — the one place that knows the difference — or the editor and the proof
// would name the same page two ways.
var BODY = PAGEMAP.bodyStart || 0;
function folioOf(sheet){
  if (!sheet) return '';
  if (!BODY) return String(sheet);
  if (sheet >= BODY) return String(sheet - BODY + 1);
  var R = [[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']], v = sheet, out = '';
  R.unshift([100,'c'],[90,'xc'],[50,'l'],[40,'xl']);
  for (var i = 0; i < R.length; i += 1){ while (v >= R[i][0]){ out += R[i][1]; v -= R[i][0]; } }
  return out;
}
function chunkPage(c){
  for (var i=0;i<c.units.length;i++){
    var p = pageOfNode(c.units[i]);
    if (p) return p;
    var kids = c.units[i].querySelectorAll('p,h1,h2,h3,h4,h5,li');
    for (var j=0;j<kids.length;j++){ var q = pageOfNode(kids[j]); if (q) return q; }
  }
  return null;
}

var current = Number(localStorage.getItem(SECKEY) || 0);
if (!(current >= 0 && current < chunks.length)) current = 0;

(function(){
  var c = chunks[current];
  var shell = c.comp.cloneNode(false);
  var mid = document.createElement('div'), inner = document.createElement('div');
  c.units.forEach(function(u){ inner.appendChild(u.cloneNode(true)); });
  mid.appendChild(inner); shell.appendChild(mid);
  document.getElementById('ed-slot').innerHTML = shell.outerHTML;
})();

window.PagedConfig = {
  auto: true,
  renderTo: document.getElementById('ed-stage'),
  after: function(){ if (window.ED && window.ED.ready) window.ED.ready(); }
};

return {
  SRC: SRC, chunks: chunks, current: current, marks: marks,
  chunkPage: chunkPage, pageOfNode: pageOfNode, folioOf: folioOf,
  setSection: function(i){
    try { localStorage.removeItem(PLACEKEY); } catch (e) {}
    localStorage.setItem(SECKEY, String(i)); location.reload();
  },
  addMark: function(m){ savePlace(m.id); marks.push(m); saveMarks(marks); location.reload(); },
  // One of a kind per block: a second tracking value for the same paragraph
  // would not add to the first, it would silently lose to it on replay.
  setMark: function(m){
    for (var i = marks.length - 1; i >= 0; i -= 1){
      if (String(marks[i].id) === String(m.id) && marks[i].do === m.do) marks.splice(i, 1);
    }
    if (!m.drop) marks.push(m);
    savePlace(m.id); saveMarks(marks); location.reload();
  },
  takePlace: function(){
    try {
      var raw = localStorage.getItem(PLACEKEY);
      localStorage.removeItem(PLACEKEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  },
  loadFile: function(list){ marks.length = 0;
    list.forEach(function(m){ marks.push(m); });
    saveMarks(marks); location.reload();
  },
  savedAt: function(){ try { return localStorage.getItem(STAMPKEY); } catch(e){ return null; } },
  dropMarks: function(id){
    savePlace(id);
    marks = marks.filter(function(m){ return String(m.id) !== String(id); });
    saveMarks(marks); location.reload();
  },
  popMark: function(){
    savePlace(marks.length ? marks[marks.length - 1].id : null);
    marks.pop(); saveMarks(marks); location.reload();
  },
  clearAll: function(){ localStorage.removeItem(KEY); location.reload(); }
};
})();
</script>

<script>/*PAGED_JS*/</script>

<script>
(function(){
"use strict";
var ED = window.ED;
var stage = document.getElementById('ed-stage');
var panel = document.getElementById('ed-panel');
var busy  = document.getElementById('ed-busy');
var sel = null, selId = null;

function srcNode(id){ return ED.SRC.querySelector('[data-ed="' + id + '"]'); }

(function buildSections(){
  var selectEl = document.getElementById('ed-sections');
  var listEl = document.getElementById('ed-sectionlist');
  ED.chunks.forEach(function(c, i){
    var p = ED.chunkPage(c);
    var o = document.createElement('option');
    o.value = i;
    o.textContent = (p ? 'p' + ED.folioOf(p) + ' — ' : '') + (c.title || 'section ' + (i+1));
    if (i === ED.current) o.selected = true;
    selectEl.appendChild(o);

    var a = document.createElement('a');
    a.href = 'javascript:void 0';
    if (i === ED.current) a.className = 'on';
    var sp = document.createElement('span'); sp.className = 'pg'; sp.textContent = p ? 'p' + ED.folioOf(p) : '';
    a.appendChild(sp);
    a.appendChild(document.createTextNode(c.title || ('section ' + (i+1))));
    a.addEventListener('click', function(){ ED.setSection(i); });
    listEl.appendChild(a);
  });
  selectEl.addEventListener('change', function(){ ED.setSection(Number(selectEl.value)); });
  document.getElementById('ed-prev').addEventListener('click', function(){
    if (ED.current > 0) ED.setSection(ED.current - 1); });
  document.getElementById('ed-next').addEventListener('click', function(){
    if (ED.current < ED.chunks.length - 1) ED.setSection(ED.current + 1); });
  var on = listEl.children[ED.current];
  if (on) on.scrollIntoView({ block: 'center' });
})();

(function countChanges(){
  var ids = {};
  ED.marks.forEach(function(m){ ids[m.id] = 1; });
  var k = Object.keys(ids).length;
  var el = document.getElementById('ed-changes');
  // Where the changes live is not obvious from looking at the page, and the
  // answer matters: they are in this browser, not in the file. Say so, with
  // the time of the last one, so a session that did not save is visible.
  var when = ED.savedAt();
  if (when){
    var d = new Date(when);
    when = isNaN(d) ? null : d.toLocaleString(undefined,
      { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
  }
  el.textContent = k
    ? (k + ' block' + (k===1?'':'s') + ' changed · saved in this browser' +
       (when ? ' ' + when : ''))
    : 'no changes yet';
  el.title = k
    ? 'Your corrections are stored by this browser on this computer, not inside ' +
      'the HTML file. They survive closing the tab and reopening the file. They do ' +
      'not travel to another computer or browser, and clearing browsing data erases ' +
      'them. Use "Save changes file" to keep a copy you own.'
    : '';
})();

function clearHover(){
  var h = stage.querySelector('.ed-hover'); if (h) h.classList.remove('ed-hover');
}

function pick(id){
  var prev = stage.querySelector('.ed-sel'); if (prev) prev.classList.remove('ed-sel');
  var shown = stage.querySelector('[data-ed="' + id + '"]');
  if (shown) shown.classList.add('ed-sel');
  selId = id; sel = srcNode(id);
  if (!sel) return;
  var txt = (sel.textContent || '').replace(/\s+/g,' ').trim();
  document.getElementById('ed-what').textContent =
    txt ? txt.slice(0,420) : '(an image or an empty block)';
  var bits = [];
  var p = ED.pageOfNode(sel); if (p) bits.push('book page ' + ED.folioOf(p));
  bits.push(sel.tagName.toLowerCase());
  var mine = ED.marks.filter(function(m){ return String(m.id) === String(id); });
  if (mine.length) bits.push(mine.map(function(m){ return m.do; }).join(', '));
  var rendered = stage.querySelector('[data-ed="' + id + '"]');
  for (var up = rendered; up && stage.contains(up); up = up.parentElement){
    if (up.hasAttribute && up.hasAttribute('data-ed') &&
        getComputedStyle(up).breakInside === 'avoid'){
      bits.push(up === rendered ? 'will not break' : 'inside a box that will not break');
      break;
    }
  }
  document.getElementById('ed-meta').textContent = bits.join(' · ');
  trackPending = trackMark(id);
  trackShow();
  panel.classList.add('on');
}

// ---------------------------------------------------------------------------
// Tracking, the copyfitter's nudge: a step at a time until the word comes up.
//
// Each step is five thousandths of an em. Points were asked for and are the
// wrong unit here — one point at this type size is about a tenth of an em,
// twenty steps at once, and a single click would visibly open the words.
//
// The steps are collected and applied once, because applying means
// repaginating the section. While stepping, the value is written straight
// onto the block on the page: the line breaks inside its own box are then
// right, which is what you are watching, though nothing moves across a page
// boundary until Apply.
// Measured on this theme rather than guessed: a ten-line paragraph in the
// 64mm column gives up a line at about -40, and not at -25. So the ceiling
// is 60 — far enough to be useful on a long paragraph, not so far that the
// tightening stops being typography — and the readout counts the lines, so
// the step that wins the line is visible instead of guessed at.
var TRACK_STEP = 5, TRACK_MAX = 60;
var trackPending = 0;

function trackMark(id){
  var m = ED.marks.filter(function(x){
    return String(x.id) === String(id) && x.do === 'track'; });
  return m.length ? Number(m[m.length-1].em) || 0 : 0;
}
function trackShow(){
  var label = trackPending
    ? (trackPending > 0 ? '+' + trackPending : String(trackPending)) : 'normal';
  var live = stage.querySelectorAll('[data-ed="' + selId + '"]');
  for (var i = 0; i < live.length; i += 1){
    live[i].style.letterSpacing = (trackPending / 1000) + 'em';
  }
  // A block broken over a column or page boundary is two rectangles and its
  // height is the column's, not its own, so counting lines there would lie.
  if (live.length === 1 && live[0].getClientRects().length === 1){
    var lh = parseFloat(getComputedStyle(live[0]).lineHeight);
    var h = live[0].getBoundingClientRect().height;
    if (lh > 0 && h > 0) label += ' · ' + Math.round(h / lh) + ' lines';
  } else if (live.length){
    label += ' · spans a break';
  }
  document.getElementById('ed-trackval').textContent = label;
}
document.getElementById('ed-track').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b || !sel) return;
  if (b.id === 'ed-trackgo'){
    ED.setMark({ id: selId, do: 'track', em: trackPending, drop: trackPending === 0 });
    return;
  }
  var tk = b.getAttribute('data-tk');
  if (tk === null) return;
  var step = Number(tk);
  trackPending = step === 0 ? 0
    : Math.max(-TRACK_MAX, Math.min(TRACK_MAX, trackPending + step));
  trackShow();
});

panel.addEventListener('click', function(e){
  var b = e.target.closest('button.act'); if (!b) return;
  var what = b.getAttribute('data-do');
  if (what === 'close'){ panel.classList.remove('on'); return; }
  if (!sel) return;
  if (what === 'undo'){ ED.dropMarks(selId); return; }
  if (what === 'delete'){
    var t = (sel.textContent||'').replace(/\s+/g,' ').trim();
    if (!confirm('Delete this block?\n\n' + (t ? t.slice(0,160) : '(empty block)'))) return;
    ED.addMark({ id: selId, do: 'delete' });
    return;
  }
  if (what === 'span'){
    // A switch, not a pile: a second click takes the block back to columns.
    var has = ED.marks.some(function(m){
      return String(m.id) === String(selId) && m.do === 'span'; });
    ED.setMark({ id: selId, do: 'span', drop: has });
    return;
  }
  if (what === 'allowbreak'){
    // The label the eye lands on is a paragraph inside the box that will not
    // break; it is the box that has to be told, not the paragraph. Only the
    // rendered tree knows which ancestor carries the rule, because the source
    // is detached and has no computed style, so resolve it here and store the
    // id that matters.
    var node = stage.querySelector('[data-ed="' + selId + '"]');
    var holder = null;
    while (node && stage.contains(node)){
      if (node.hasAttribute('data-ed') &&
          getComputedStyle(node).breakInside === 'avoid') holder = node;
      node = node.parentElement;
    }
    if (!holder){
      alert('Nothing here is holding the column open — this block is already ' +
            'free to break across a column or page.');
      return;
    }
    ED.addMark({ id: holder.getAttribute('data-ed'), do: 'allowbreak' });
    return;
  }
  if (what === 'joinnext'){
    // The half a person clicks is the one that looks wrong, and that is the
    // upper one — its last line is the stretched one. The repair is the same
    // join, made from the lower half, so find the lower half and ask for
    // that: the block that follows this one, stepping out of a label box if
    // this is the last thing in it.
    var TEXTB = 'p,li,h1,h2,h3,h4,h5,dd';
    var from = sel, below = null;
    while (from && from !== ED.SRC && !below){
      below = from.nextElementSibling;
      while (below && below.tagName === 'A' && !below.textContent.trim()) below = below.nextElementSibling;
      if (!below) from = from.parentElement;
    }
    if (below && !below.matches(TEXTB)) below = below.querySelector(TEXTB);
    // Only if joining that block upward really does land on this one.
    var lands = null;
    if (below){
      var up2 = below.previousElementSibling;
      if (up2 && up2.matches(TEXTB)) lands = up2;
      else if (up2){ var inn = up2.querySelectorAll(TEXTB); lands = inn.length ? inn[inn.length - 1] : null; }
    }
    if (!below || lands !== sel){
      alert('There is no block directly below this one to join it with.');
      return;
    }
    ED.addMark({ id: below.getAttribute('data-ed'), do: 'joinprev' });
    return;
  }
  if (what === 'joinprev'){
    var above = sel.previousElementSibling;
    if (!above){
      alert('Nothing above this block inside its section to join it to.');
      return;
    }
    if (!above.matches('p,li,h1,h2,h3,h4,h5,dd') &&
        !above.querySelector('p,li,h1,h2,h3,h4,h5,dd')){
      alert('The block above has no text to join this onto.');
      return;
    }
    ED.addMark({ id: selId, do: 'joinprev' });
    return;
  }
  if (what === 'text'){
    var shown = stage.querySelector('[data-ed="' + selId + '"]');
    if (!shown){ alert('Scroll that block into view first.'); return; }
    shown.setAttribute('contenteditable', 'true');
    shown.focus();
    shown.addEventListener('blur', function once(){
      shown.removeAttribute('contenteditable');
      shown.removeEventListener('blur', once);
      ED.addMark({ id: selId, do: 'text', html: shown.innerHTML });
    });
    return;
  }
  if (what === 'image'){
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.addEventListener('change', function(){
      var f = inp.files && inp.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function(){ ED.addMark({ id: selId, do: 'image', src: fr.result, name: f.name }); };
      fr.readAsDataURL(f);
    });
    inp.click();
    return;
  }
  ED.addMark({ id: selId, do: what });
});

function download(name, text, type){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/html' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
document.getElementById('ed-save').addEventListener('click', function(){
  var copy = ED.SRC.cloneNode(true);
  copy.querySelectorAll('[data-ed]').forEach(function(el){ el.removeAttribute('data-ed'); });
  copy.querySelectorAll('.ed-hover,.ed-sel,.ed-done').forEach(function(el){
    el.classList.remove('ed-hover','ed-sel','ed-done');
  });
  download('index.html',
    '<!DOCTYPE html>\n<html lang="en">\n<head>\n<title>aet-md</title>\n' +
    '<meta http-equiv="content-type" content="text/html; charset=UTF-8" />\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
    '<script src="../../js/pager.js"><\/script>\n</head>\n<body>\n' +
    copy.innerHTML + '\n</body>\n</html>\n');
});
// The corrections are the irreplaceable half of this. The book rebuilds from
// the manuscript in minutes; the list of hand corrections exists in one
// browser's storage and nowhere else. So the file it writes is not only a
// report to read — it carries the marks themselves, and Load puts them back,
// on this machine or another.
document.getElementById('ed-list').addEventListener('click', function(){
  var rows = ED.marks.map(function(m){
    var node = srcNode(m.id);
    return {
      page: node ? (ED.folioOf(ED.pageOfNode(node)) || null) : null,
      sheet: node ? (ED.pageOfNode(node) || null) : null,
      change: m.do + (m.do === 'track' ? ' ' + (m.em > 0 ? '+' : '') + m.em : ''),
      file: m.name || undefined,
      anchor: node ? (node.textContent||'').replace(/\s+/g,' ').trim().slice(0,70) : ''
    };
  });
  rows.sort(function(a,b){ return (a.sheet||0) - (b.sheet||0); });
  var stamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,16);
  download('AET-corrections-' + stamp + '.json', JSON.stringify({
    book: 'Advanced and Emerging Therapies',
    saved: new Date().toISOString(),
    blocks: Object.keys(ED.marks.reduce(function(a,m){ a[m.id]=1; return a; }, {})).length,
    changes: rows,
    marks: ED.marks
  }, null, 1), 'application/json');
});
document.getElementById('ed-load').addEventListener('click', function(){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.addEventListener('change', function(){
    var f = inp.files && inp.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      var data;
      try { data = JSON.parse(fr.result); }
      catch(e){ alert('That file is not a corrections file — it would not parse.'); return; }
      var list = Array.isArray(data) ? data : data && data.marks;
      if (!Array.isArray(list) || !list.length){
        alert('No corrections in that file. A corrections file has a "marks" list in it.');
        return;
      }
      var bad = list.filter(function(m){ return !m || m.id === undefined || !m.do; });
      if (bad.length){ alert('That file has ' + bad.length + ' entries this editor cannot read.'); return; }
      if (!confirm('Replace the ' + ED.marks.length + ' change' + (ED.marks.length===1?'':'s') +
                   ' in this browser with the ' + list.length + ' in that file?')) return;
      ED.loadFile(list);
    };
    fr.readAsText(f);
  });
  inp.click();
});
(function viewControls(){
  var z = document.getElementById('ed-zoom');
  // Fit the page between the two rails. Clamped on every load, not just the
  // first: a zoom chosen on a wide screen pushes the page under the panel on
  // a narrow one, and the page sliding under the panel is the whole fault
  // this is here to prevent.
  var stage = document.getElementById('ed-stage');
  // 816 was the old default page box and is only the first-load fallback now;
  // every render since records what the page actually measures.
  var pageW = parseFloat(localStorage.getItem('aet-editor-pagew') || '0') || 816;
  var maxFit = Math.max(0.5, Math.min(1.25, (stage.clientWidth - 64) / pageW));
  var saved = parseFloat(localStorage.getItem('aet-editor-zoom') || '1');
  if (!(saved > 0)) saved = 1;
  var use = Math.round(Math.min(saved, maxFit) * 20) / 20;
  localStorage.setItem('aet-editor-zoom', String(use));
  z.value = String(use);
  if (!z.value) { var o = document.createElement('option');
    o.value = String(use); o.textContent = Math.round(use*100) + '%';
    z.appendChild(o); z.value = String(use); }
  document.documentElement.style.setProperty('--zoom', String(use));
  z.addEventListener('change', function(){
    document.documentElement.style.setProperty('--zoom', z.value);
    localStorage.setItem('aet-editor-zoom', z.value);
  });
  var rail = document.getElementById('ed-rail');
  if (localStorage.getItem('aet-editor-rail') === 'off') document.body.classList.add('railoff');
  rail.addEventListener('click', function(){
    document.body.classList.toggle('railoff');
    localStorage.setItem('aet-editor-rail',
      document.body.classList.contains('railoff') ? 'off' : 'on');
  });
})();

// A deleted block cannot be clicked to undo it, so the last change can
// always be taken back from the bar.
document.getElementById('ed-undo').addEventListener('click', function(){
  if (!ED.marks.length){ alert('Nothing to undo.'); return; }
  ED.popMark();
});

document.getElementById('ed-reset').addEventListener('click', function(){
  if (ED.marks.length && confirm('Remove all ' + ED.marks.length + ' changes?')) ED.clearAll();
});

window.ED.ready = function(){
  busy.classList.add('off');
  var first = ED.chunkPage(ED.chunks[ED.current]);
  var pages = stage.querySelectorAll('.pagedjs_page');
  Array.prototype.forEach.call(pages, function(pg, i){
    var tag = document.createElement('div');
    tag.className = 'ed-lbl';
    tag.textContent = first ? ('book page ' + ED.folioOf(first + i)) : ('page ' + (i+1) + ' of this section');
    pg.parentNode.insertBefore(tag, pg);
  });
  document.getElementById('ed-count').textContent =
    pages.length + (pages.length === 1 ? ' page' : ' pages');

  // The folio counts from 1 inside the section Paged.js was given, so page 24
  // of the book prints "1". The label above each page already says the real
  // number; this makes the printed one agree with it, because a correction
  // comes back as a page number and the two must not disagree.
  // The content sits on the box's ::after, not on the box, so there is no
  // inline style to set — the override has to be a rule.
  // One section is paginated at a time, so Paged.js takes the first page of
  // every section for the first page of its part and would strip its head
  // and foot. Only the part's own opening page is that page, so the build
  // leaves the rule out and it is applied here, to the one section that
  // really does begin a part.
  var here = ED.chunks[ED.current];
  var opensPart = /\bpart-\d+\b/.test(here.comp.className) &&
    ED.chunks.filter(function(x){ return x.comp === here.comp; })[0] === here;
  if (first || opensPart){
    var folio = [];
    if (opensPart){
      folio.push('.pagedjs_page[data-page-number="1"] .pagedjs_margin-content::after' +
                 '{content:none!important}');
    }
    Array.prototype.forEach.call(pages, function(pg, i){
      if (!first || (opensPart && i === 0)) return;
      var n = pg.getAttribute('data-page-number');
      Array.prototype.forEach.call(pg.querySelectorAll('.pagedjs_margin-content'),
        function(box){
          if (!/counter\(\s*page/.test(getComputedStyle(box, '::after').content)) return;
          var cls = (box.parentNode.className
                      .match(/pagedjs_margin-(?:top|bottom)-[a-z-]+/) || [])[0];
          if (!cls) return;
          folio.push('.pagedjs_page[data-page-number="' + n + '"] .' + cls +
                     ' .pagedjs_margin-content::after{content:"' + ED.folioOf(first + i) + '"!important}');
        });
    });
    if (folio.length){
      var st = document.getElementById('ed-folio') || document.createElement('style');
      st.id = 'ed-folio';
      st.setAttribute('data-pagedjs-ignore', '');
      st.textContent = folio.join('\n');
      document.head.appendChild(st);
    }
  }

  // A 7in page in a stage sized for an 8.5in one is needlessly small, so the
  // first render after the page box changes refits rather than waiting for
  // the next load to read the stored width.
  (function refit(){
    var sheet = stage.querySelector('.pagedjs_sheet');
    if (!sheet) return;
    var z = parseFloat(getComputedStyle(document.documentElement)
              .getPropertyValue('--zoom')) || 1;
    var cssW = sheet.getBoundingClientRect().width / z;
    if (!(cssW > 100)) return;
    localStorage.setItem('aet-editor-pagew', String(Math.round(cssW)));
    var want = parseFloat(localStorage.getItem('aet-editor-zoom') || '1') || 1;
    var fit = Math.round(Math.max(0.5, Math.min(want, (stage.clientWidth - 64) / cssW)) * 20) / 20;
    if (Math.abs(fit - z) > 0.001){
      document.documentElement.style.setProperty('--zoom', String(fit));
      var sel = document.getElementById('ed-zoom');
      if (sel && sel.querySelector('option[value="' + fit + '"]')) sel.value = String(fit);
    }
  })();

  stage.addEventListener('mouseover', function(e){
    var t = e.target.closest && e.target.closest('[data-ed]');
    if (!t || !stage.contains(t)) return;
    clearHover(); t.classList.add('ed-hover');
  });
  stage.addEventListener('mouseout', clearHover);
  stage.addEventListener('click', function(e){
    var t = e.target.closest && e.target.closest('[data-ed]');
    if (!t || !stage.contains(t)) return;
    e.preventDefault();
    pick(t.getAttribute('data-ed'));
  });

  var ids = {};
  ED.marks.forEach(function(m){ ids[m.id] = 1; });
  Object.keys(ids).forEach(function(id){
    var el = stage.querySelector('[data-ed="' + id + '"]');
    if (el) el.classList.add('ed-done');
  });

  // Back to where the work was. The block first, because the page it sat on
  // may have moved; the page next, for an edit that removed the block; the
  // old scroll offset last, which is only ever approximately right.
  var place = ED.takePlace();
  if (place){
    var target = place.id
      ? stage.querySelector('[data-ed="' + place.id + '"]') : null;
    if (!target && place.page){
      target = stage.querySelector('.pagedjs_page[data-page-number="' + place.page + '"]');
    }
    if (target){
      target.scrollIntoView({ block: 'center' });
      if (place.id){
        var back = stage.querySelector('[data-ed="' + place.id + '"]');
        if (back) back.classList.add('ed-sel');
      }
    } else if (place.y){
      window.scrollTo(0, place.y);
    }
  }
};

if (stage.querySelector('.pagedjs_page')) window.ED.ready();
})();
</script>
</body>
</html>
